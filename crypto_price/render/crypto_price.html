{% extends "plugin.html" %} {% block head %} {{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/crypto_price.css') }}" />
{% endblock %} {% block content %}
<div class="crypto-screen">
  <div class="title">{{ title }}</div>

  <div class="pair-row">
    <span class="base-symbol">{{ base_symbol }}</span>
    <span class="slash">/</span>
    <span class="quote-symbol">{{ quote_symbol }}</span>
  </div>

  <div class="price-card">
    <div class="price-label">Current Price</div>
    <div class="price-value">{{ price }}</div>
  </div>

  <div class="timestamp">Updated {{ timestamp }}</div>
</div>
{% endblock %}
